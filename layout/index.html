<!DOCTYPE html>
<html>
    <head>
    <title>Layout HTML5</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            display: flex;
            margin: 0 auto;
            height: 100vh;
            color:#333;
        }
        h1 {
            color: #333;
            border-bottom: 2px solid white;
            padding-bottom: 0.3em;
        }
        h3 {
            font-size: medium;
            padding: 15px;
            border-left: 3px solid green;
            background-color: white;
        }
        nav {
            width: 25%;
            background-color: #f0f0f0;
            padding: 20px;
        }
        iframe {
            width: 75%;
            border: none;
            height: 100hv;
        }
        a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            color: #333;
        }
        a:hover {
            color: blue;
        }
    </style>
    </head>
